# Builds using maven
# Pass the arguments you wish to run to maven_commands variable, default command will be mvn install
---
name: Maven

on: 
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        java: [11, 17, 21, 25]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      maven_commands: install # default is install
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      # TEMPORARY: janelia-jhdf5 26.10.0-SNAPSHOT is not published anywhere, so build and
      # install it into ~/.m2 first. Remove these two steps once janelia-jhdf5 is released.
      - name: Check out janelia-jhdf5
        uses: actions/checkout@v6
        with:
          repository: JaneliaSciComp/janelia-jhdf5
          ref: main
          path: janelia-jhdf5
      - name: Install janelia-jhdf5 snapshot
        working-directory: janelia-jhdf5
        run: mvn -B -U install -DskipTests -Djacoco.skip=true
        shell: bash
      - name: Build
        run: mvn ${{ env.maven_commands }}
