name: "Build and push artifacts"
on:
  push:
    tags:
      - '*'

jobs:
  build:
    permissions:
      contents: write
    name: Release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central
        run: mvn -P release deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Build artifacts
        run: |
          ./tools/test-build ant
          ant release docs
      - name: Create a release and upload Release Assets
        run: |
          cd artifacts
          sha256sum ./*.zip >> SHASUMS
          sha256sum ./*.jar >> SHASUMS
          sha256sum ./*.xz >> SHASUMS
          sha256sum ./*.gz >> SHASUMS
          tag_name="${GITHUB_REF##*/}"
          gh release create --generate-notes "$tag_name" ./*.zip ./*.jar ./*.xz ./*.gz SHASUMS
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
